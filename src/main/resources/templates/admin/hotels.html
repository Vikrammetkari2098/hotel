<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/layout-main}">
<head>
    <title>Hotel List</title>
    <style>
        body {
            background-image: url('/img/6.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }

        .container {
         
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;

        }

        h2 {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .alert {
            font-size: 14px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }

        table th, table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        table th {
            background-color: #007bff;
            color: white;
        }

        .btn-danger {
            border-radius: 25px;
            padding: 6px 16px;
            font-weight: 600;
        }

        .btn-danger:hover {
            background-color: #cc3b3b;
        }

        a {
            text-decoration: none;
            color: #007bff;
            font-weight: 600;
        }

        a:hover {
            text-decoration: underline;
        }

        .text-danger {
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<th:block layout:fragment="content">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h2>Hotel List</h2>
                <div th:if="${param.success}">
                    <div class="alert alert-success">
                        Hotel (ID: <span th:text="${updatedHotelId}"></span>) info has been successfully updated
                    </div>
                </div>
                <table class="table table-striped align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Hotel Manager</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr class="align-middle" th:each="hotel : ${hotels}">
                        <td th:text="${hotel.id}"></td>
                        <td th:text="${hotel.name}"></td>
                        <td th:text="${hotel.managerUsername}"></td>
                        <td>
                            <a th:href="@{/admin/hotels/edit/{id}(id=${hotel.id})}">Edit</a>
                        </td>
                        <td>
                            <form method="post" th:action="@{/admin/hotels/delete/{id}(id=${hotel.id})}"
                                  onsubmit="return confirm('Are you sure you want to delete this hotel?');">
                                <input type="hidden" name="_method" value="DELETE"/>
                                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
