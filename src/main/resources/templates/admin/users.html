<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/layout-main}">
<head>
    <title>User List</title>
    <style>
        body {
                 background-image: url('/img/1.jpg');
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
          
        }

      

        h2 {
            margin-bottom: 20px;
            font-weight: 600;
        }

        .table {
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .table th {
            background-color: #007bff;
            color: white;
            font-weight: 500;
            vertical-align: middle;
        }

        .table td {
            vertical-align: middle;
        }

        .alert {
            border-radius: 10px;
            font-size: 15px;
            font-weight: 500;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .btn-danger {
            border-radius: 20px;
            font-weight: 500;
            padding: 5px 15px;
        }

        a {
            color: #007bff;
            font-weight: 500;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        form {
            display: inline;
        }
    </style>
</head>
<body>
<th:block layout:fragment="content">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h2>User List</h2>

                <div th:if="${param.success}">
                    <div class="alert alert-success">
                        User (ID: <span th:text="${updatedUserId}"></span>) info has been successfully updated
                    </div>
                </div>

                <table class="table table-striped align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Name</th>
                        <th>Last Name</th>
                        <th>Role</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr class="align-middle" th:each="user : ${users}">
                        <td th:text="${user.id}"></td>
                        <td th:text="${user.username}"></td>
                        <td th:text="${user.name}"></td>
                        <td th:text="${user.lastName}"></td>
                        <td th:text="${user.role.roleType.name()}"></td>
                        <td>
                            <a th:href="@{/admin/users/edit/{id}(id=${user.id})}">Edit</a>
                        </td>
                        <td>
                            <form method="post" th:if="${user.role.roleType.name() != 'ADMIN'}"
                                  th:action="@{/admin/users/delete/{id}(id=${user.id})}"
                                  onsubmit="return confirm('Are you sure you want to delete this user?');">
                                <input type="hidden" name="_method" value="DELETE"/>
                                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
