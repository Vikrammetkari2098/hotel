<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/layout-main}">
<head>
    <title>Your Bookings</title>
    <style>
        /* Background image for the page */
        body {
            background-image: url('/img/1.jpg'); /* Replace with your image path */
            background-size: cover;
            background-position: center;
            font-family: 'Arial', sans-serif;
            color: #fff;
        }

      

        h2 {
            color: #fff;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .table {
            background-color: rgba(255, 255, 255, 0.8); /* Table background with slight transparency */
            border-radius: 10px;
            color: #333;
        }

        .table th, .table td {
            padding: 10px;
        }

        .table-striped tbody tr:nth-of-type(odd) {
            background-color: rgba(0, 0, 0, 0.1); /* Odd row background */
        }

        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #004085;
        }

        .btn-sm {
            padding: 5px 10px;
        }
    </style>
</head>
<body>
<th:block layout:fragment="content">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h2>Your Bookings</h2>
                <table class="table table-striped align-middle">
                    <thead>
                    <tr>
                        <th>City</th>
                        <th>Check-In</th>
                        <th>Check-Out</th>
                        <th>Hotel</th>
                        <th>Total Price</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr class="align-middle" th:each="booking : ${bookings}">
                        <td th:text="${booking.hotelAddress.city}"></td>
                        <td th:text="${booking.checkinDate}"></td>
                        <td th:text="${booking.checkoutDate}"></td>
                        <td th:text="${booking.hotelName}"></td>
                        <td th:text="'₹ ' + ${#numbers.formatDecimal(booking.totalPrice, 0, 'COMMA', 2, 'POINT')}"></td>
                        <td>
                            <a th:href="@{/customer/bookings/{id}(id=${booking.id})}" class="btn btn-primary btn-sm">Details</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
