<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/layout-main}">
<head>
    <title>Manager's Bookings</title>
    <style>
        body {
            background-image: url('/img/6.jpg'); /* Ensure the image path is correct */
            background-size: cover;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-position: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            background-color: rgba(255, 255, 255, 0.95);
          
           
           
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .table thead th {
            background-color: #007bff;
            color: white;
            vertical-align: middle;
        }

        .table td, .table th {
            vertical-align: middle;
            color: #333;
        }

        .btn-primary {
            background-color: #007bff;
            border: none;
        }

        .btn-primary:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
<th:block layout:fragment="content">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h2>Manager's Bookings</h2>
                <table class="table table-striped align-middle">
                    <thead>
                    <tr>
                        <th>Hotel</th>
                        <th>Confirmation No.</th>
                        <th>Customer</th>
                        <th>Total Price</th>
                        <th>Payment Status</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr class="align-middle" th:each="booking : ${bookings}">
                        <td th:text="${booking.hotelName}"></td>
                        <td th:text="${booking.confirmationNumber}"></td>
                        <td th:text="${booking.customerName}"></td>
                        <td th:text="'₹' + ${#numbers.formatDecimal(booking.totalPrice, 0, 'COMMA', 2, 'POINT')}"></td>
                        <td th:text="${booking.paymentStatus}"></td>
                        <td>
                            <a th:href="@{/manager/bookings/{id}(id=${booking.id})}" class="btn btn-primary btn-sm">Details</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
