<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/layout-main}">
<head>
    <title>Manager Dashboard</title>
    <style>
        body {
             background-image: url('/img/3.jpg');
        }

        .dashboard-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: 30px;
        }

        .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }

        .dashboard-card .card-body {
            padding: 30px 20px;
        }

        .dashboard-card i {
            color: #0d6efd;
            margin-bottom: 15px;
        }

        .dashboard-card .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .dashboard-card .btn {
            padding: 8px 20px;
            font-weight: 500;
            border-radius: 30px;
        }

        .container {
            margin-top: 50px;
        }
    </style>
</head>
<body>
<th:block layout:fragment="content">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card dashboard-card text-center">
                <div class="card-body">
                    <i class="bi bi-plus-square-dotted fs-1"></i>
                    <h5 class="card-title">Add Hotel</h5>
                    <a th:href="@{/manager/hotels/add}" class="btn btn-primary">Go</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card dashboard-card text-center">
                <div class="card-body">
                    <i class="bi bi-building fs-1"></i>
                    <h5 class="card-title">My Hotels</h5>
                    <a th:href="@{/manager/hotels}" class="btn btn-primary">Go</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card dashboard-card text-center">
                <div class="card-body">
                    <i class="bi bi-calendar-check fs-1"></i>
                    <h5 class="card-title">Hotel Bookings</h5>
                    <a th:href="@{/manager/bookings}" class="btn btn-primary">Go</a>
                </div>
            </div>
        </div>
    </div>
</div>
</th:block>
</body>
</html>
