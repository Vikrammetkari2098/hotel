<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/layout-main}">
<head>
    <title>My Hotels</title>
    <style>
    body {
            background-image: url('/img/3.jpg');
        background-size: cover;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #333;
    }

    .container {
        background-color: rgba(255, 255, 255, 0.95);
        border-radius: 12px;
        padding: 30px;
        margin-top: 60px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    h2 {
        text-align: center;
        margin-bottom: 30px;
        font-weight: 700;
        color: #0d6efd;
    }

    table.table {
        background-color: white;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 0 12px rgba(0, 0, 0, 0.08);
    }

    table.table thead {
        background-color: #0d6efd;
        color: white;
    }

    table.table th,
    table.table td {
        text-align: center;
        vertical-align: middle;
    }

    table.table tr:hover {
        background-color: #f1f5ff;
    }

    .alert-success {
        background-color: #d1e7dd;
        border-left: 6px solid #0f5132;
        padding: 10px 15px;
        margin-bottom: 20px;
        border-radius: 8px;
        font-weight: 500;
    }

    a {
        color: #0d6efd;
        text-decoration: none;
        font-weight: 500;
    }

    a:hover {
        text-decoration: underline;
    }

    .btn-danger {
        padding: 4px 12px;
        font-size: 0.9rem;
        border-radius: 6px;
    }
</style>
    
</head>
<body>
<th:block layout:fragment="content">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <h2> Hotels</h2>
                <div th:if="${message}">
                    <div class="alert alert-success" th:text="${message}">
                    </div>
                </div>
                <table class="table table-striped align-middle">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Single Room Price</th>
                        <th>Double Room Price</th>
                        <th>Edit</th>
                        <th>Delete</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr class="align-middle" th:each="hotel : ${hotels}">
                        <td th:text="${hotel.id}"></td>
                        <td th:text="${hotel.name}"></td>
                        <td th:each="room : ${hotel.roomDTOs}" th:if="${room.roomType.name() == 'SINGLE'}" th:text="'₹' + ${#numbers.formatDecimal(room.pricePerNight, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td th:each="room : ${hotel.roomDTOs}" th:if="${room.roomType.name() == 'DOUBLE'}" th:text="'₹' + ${#numbers.formatDecimal(room.pricePerNight, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td>
                            <a th:href="@{/manager/hotels/edit/{id}(id=${hotel.id})}">Edit</a>
                        </td>
                        <td>
                            <form method="post"
                                  th:action="@{/manager/hotels/delete/{id}(id=${hotel.id})}"
                                  onsubmit="return confirm('Are you sure you want to delete this hotel?');">
                                <input type="hidden" name="_method" value="DELETE"/>
                                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
