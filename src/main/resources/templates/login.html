<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{/layout/layout-main}">
<head>
    <title>Login page</title>
    <style>
        body {
            background: url('/img/2.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Arial', sans-serif;
            color: #fff;
        }

       
        .card-header {
            background-color: #2575fc;
            color: #fff;
            border-bottom: 2px solid #fff;
            padding: 15px;
            text-align: center;
        }
        .card-body {
            background-color: #fff;
            color: #333;
            border-radius: 10px;
            padding: 20px;
        }

        .form-group .form-control {
            border-radius: 5px;
            border: 1px solid #ccc;
            transition: all 0.3s ease;
        }

        .form-group .form-control:focus {
            border-color: #2575fc;
            box-shadow: 0 0 5px rgba(37, 117, 252, 0.5);
        }
        .btn-primary {
            background-color: #2575fc;
            border-color: #2575fc;
            border-radius: 5px;
            padding: 10px 20px;
            font-size: 16px;
            width: 100%;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #6a11cb;
            border-color: #6a11cb;
        }

        .form-label {
            font-weight: bold;
        }

        .alert-danger, .alert-success {
            margin-top: 10px;
            font-size: 16px;
            border-radius: 5px;
        }

        .card {
            border-radius: 10px;
            border: none;
        }

        .container h2 {
            font-size: 28px;
        }

        .form-text {
            font-size: 12px;
            color: #6c757d;
        }

        .card-header h2 {
            font-size: 24px;
        }

        .card-body span {
            font-size: 14px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                margin-top: 30px;
                padding: 20px;
            }

            .card-header h2 {
                font-size: 22px;
            }

            .btn-primary {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
<th:block layout:fragment="content">
    <div class="container">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <div th:if="${param.error}">
                    <div class="alert alert-danger">Invalid Email or Password</div>
                </div>
                <div th:if="${param.logout}">
                    <div class="alert alert-success">You have successfully logged out</div>
                </div>
                <div class="card">
                    <div class="card-header">
                        <h2 class="text-center">Login</h2>
                    </div>
                    <div class="card-body">
                        <form method="post" th:action="@{/login}">
                            <div class="form-group mb-3">
                                <label class="form-label" for="username">Email:</label>
                                <input class="form-control" id="username" name="username" type="email" placeholder="Email" autofocus>
                                <small class="form-text text-muted">e.g. example@gmail.com</small>
                            </div>
                            <div class="form-group mb-3">
                                <label class="form-label" for="password">Password:</label>
                                <input class="form-control" id="password" name="password" type="password" placeholder="Enter password">
                            </div>
                            <div class="form-group mb-3">
                                <button type="submit" class="btn btn-primary">Login</button>
                                <span>Not registered? <a th:href="@{/register/customer}">Register here</a></span>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
